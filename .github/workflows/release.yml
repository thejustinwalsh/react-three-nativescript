# Reference release workflow, adapted from react-three-fiber's canary.yml.
#
# This is a technical preview: @react-three/nativescript is marked "private": true, so nothing
# publishes from here yet. The workflow builds and PACKS the package (producing the exact tarball
# that would ship) as a downloadable artifact. To turn it into a real publisher once the package
# graduates: drop "private": true from packages/nativescript/package.json and swap the `pack` step
# for the `publish` step shown in the comment below.
name: Release
on:
  workflow_dispatch:

permissions:
  id-token: write # required for npm OIDC provenance when this becomes a real publisher
  contents: read

jobs:
  pack:
    name: Build and pack (no publish)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pack tarball (the artifact that would publish)
        run: pnpm --filter @react-three/nativescript pack --pack-destination .

      # Publishing step (commented out for technical preview):
      #   pnpm --filter @react-three/nativescript publish --tag canary --no-git-checks --provenance
      #   env: NODE_AUTH_TOKEN / OIDC

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-three-nativescript
          path: '*.tgz'
